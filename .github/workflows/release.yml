name: release

on:
  push:
    branches: [claude/valsync-settings-manager-fk9lxn, main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          "version=$ver" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/valsync.exe out/valsync.exe
          Copy-Item README.md out/README.md
          Compress-Archive -Path out/valsync.exe, out/README.md -DestinationPath out/valsync-windows-x64.zip -Force
          (Get-FileHash out/valsync.exe -Algorithm SHA256).Hash.ToLower() + "  valsync.exe" | Out-File -Encoding ascii out/SHA256SUMS.txt
          target/release/valsync.exe --version
          target/release/valsync.exe bench
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: VALSYNC ${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(steps.pkg.outputs.version, '-') }}
          make_latest: true
          body: |
            **Beta.** Copy your VALORANT settings between accounts — sensitivity, crosshair, keybinds, video settings and more.

            1. Download **valsync.exe**.
            2. Open the Riot Client and sign in.
            3. Double-click valsync.exe (or run `valsync` in a terminal).

            No setup, no API keys, no password. Every change is backed up first and can be undone.

            Built and tested on Windows by GitHub Actions. Please report anything that doesn't work as an issue.
          files: |
            out/valsync.exe
            out/valsync-windows-x64.zip
            out/SHA256SUMS.txt
