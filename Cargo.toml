[package]
name = "valsync"
version = "0.2.0-beta.1"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
crossterm = "0.29.0"
flate2 = "1.1.11"
hex = "0.4.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form", "query", "system-proxy"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "io-util"] }
toml = "1.2.2"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lib]
name = "valsync"
path = "src/lib.rs"

[[bin]]
name = "valsync"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1
